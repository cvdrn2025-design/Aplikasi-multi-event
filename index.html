<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Event Baru</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Animasi untuk toast */
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }
    
    /* Style tambahan untuk validasi */
    .form-group input:invalid,
    .form-group select:invalid {
      border-color: #ff4444;
    }
    
    .form-group input:valid,
    .form-group select:valid {
      border-color: #4CAF50;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-header">
      <h2>🎪 Buat Event Baru</h2>
      <p class="subtitle">Lengkapi form di bawah untuk membuat event baru</p>
    </div>
    
    <form id="eventForm" novalidate>
      <div class="form-group">
        <label for="eventName">📝 Nama Event</label>
        <input 
          type="text" 
          id="eventName" 
          placeholder="Contoh: Turnamen Futsal 2026" 
          minlength="3"
          required
        >
        <small class="error-message">Nama event minimal 3 karakter</small>
      </div>
      
      <div class="form-group">
        <label for="eventOrganizer">👥 Nama Penyelenggara</label>
        <input 
          type="text" 
          id="eventOrganizer" 
          placeholder="Contoh: Panitia Pelaksana" 
          required
        >
        <small class="error-message">Nama penyelenggara wajib diisi</small>
      </div>
      
      <div class="form-group">
        <label for="eventLocation">📍 Lokasi Event</label>
        <input 
          type="text" 
          id="eventLocation" 
          placeholder="Contoh: GOR Samarinda" 
          required
        >
        <small class="error-message">Lokasi event wajib diisi</small>
      </div>
      
      <div class="form-group">
        <label for="eventCategory">🏷️ Kategori Event</label>
        <select id="eventCategory" required>
          <option value="">-- Pilih Kategori --</option>
          <option value="sport">🏆 Olahraga (Sport)</option>
          <option value="music">🎵 Musik & Konser</option>
        </select>
        <small class="error-message">Kategori event wajib dipilih</small>
      </div>

      <!-- Field tersembunyi untuk Olahraga -->
      <div class="form-group hidden" id="sportCompetitionGroup">
        <label for="sportType">🎯 Cabang Olahraga</label>
        <select id="sportType">
          <option value="">-- Pilih Cabang --</option>
        </select>
      </div>
      
      <div class="form-group hidden" id="sportSubCategoryGroup">
        <label for="sportSubCategory">👥 Divisi / Nomor</label>
        <select id="sportSubCategory">
          <option value="">-- Pilih Divisi --</option>
        </select>
      </div>
      
      <div class="form-group hidden" id="sportFormatGroup">
        <label for="sportFormat">📊 Format Pertandingan</label>
        <select id="sportFormat">
          <option value="">-- Pilih Format --</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">
        💾 Simpan & Lanjutkan
      </button>
    </form>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
