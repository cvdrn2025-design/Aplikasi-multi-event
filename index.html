<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Event Baru</title>
  <!-- Menghubungkan ke file CSS global -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="form-card">
    <h2>Form Buat Event</h2>
    
    <form id="eventForm">
      <!-- 1. Input Nama Event -->
      <div class="form-group">
        <label for="eventName">Nama Event</label>
        <input 
          type="text" 
          id="eventName" 
          placeholder="Contoh: Turnamen Futsal Samarinda 2026" 
          required
        >
      </div>

      <!-- 2. Input Nama Penyelenggara -->
      <div class="form-group">
        <label for="eventOrganizer">Nama Penyelenggara</label>
        <input 
          type="text" 
          id="eventOrganizer" 
          placeholder="Contoh: Panitia Pelaksana / CV. Dinamika" 
          required
        >
      </div>

      <!-- 3. Input Lokasi Event -->
      <div class="form-group">
        <label for="eventLocation">Lokasi Event</label>
        <input 
          type="text" 
          id="eventLocation" 
          placeholder="Contoh: GOR Sempaja, Samarinda" 
          required
        >
      </div>

      <!-- 4. Pilihan Kategori Utama -->
      <div class="form-group">
        <label for="eventCategory">Kategori Event</label>
        <select id="eventCategory" required>
          <option value="">-- Pilih Kategori --</option>
          <option value="sport">Olahraga (Sport)</option>
          <option value="music">Musik & Konser</option>
          <option value="education">Edukasi & Workshop</option>
        </select>
      </div>

      <!-- 5. Dynamic Form: Cabang Olahraga (Tersembunyi secara default) -->
      <div class="form-group hidden" id="sportCompetitionGroup">
        <label for="sportType">Cabang Olahraga</label>
        <select id="sportType"></select>
      </div>

      <!-- 6. Dynamic Form: Divisi / Nomor Pertandingan -->
      <div class="form-group hidden" id="sportSubCategoryGroup">
        <label for="sportSubCategory">Divisi / Nomor</label>
        <select id="sportSubCategory"></select>
      </div>

      <!-- 7. Dynamic Form: Format Pertandingan -->
      <div class="form-group hidden" id="sportFormatGroup">
        <label for="sportFormat">Format Pertandingan</label>
        <select id="sportFormat"></select>
      </div>

      <button type="submit" class="btn-submit">Simpan & Lanjutkan</button>
    </form>
  </div>

  <!-- Memuat JavaScript utama -->
  <script src="js/main.js"></script>
</body>
</html>
