<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Event Sport</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container-card">
    <h2 id="eventTitle">Nama Event</h2>
    
    <div style="background: #e9ecef; padding: 15px; border-radius: 8px; margin: 20px 0; line-height: 1.6;">
      <p><strong>Penyelenggara:</strong> <span id="eventOrganizer">-</span></p>
      <p><strong>Lokasi:</strong> <span id="eventLocation">-</span></p>
      <p><strong>Kategori:</strong> Sport</p>
      <p><strong>Cabang:</strong> <span id="sportName">-</span></p>
      <p><strong>Divisi:</strong> <span id="sportDiv">-</span></p>
      <p><strong>Format:</strong> <span id="sportFmt">-</span></p>
    </div>

    <a href="../../index.html" class="btn-submit" style="background:#6c757d; text-align:center; text-decoration:none;">← Kembali ke Front Page</a>
  </div>

  <script>
    const rawData = localStorage.getItem('activeEvent');
    if (rawData) {
      const data = JSON.parse(rawData);
      document.getElementById('eventTitle').textContent = data.eventName;
      document.getElementById('eventOrganizer').textContent = data.organizer || '-';
      document.getElementById('eventLocation').textContent = data.location || '-';
      
      if (data.sportDetails) {
        document.getElementById('sportName').textContent = data.sportDetails.type;
        document.getElementById('sportDiv').textContent = data.sportDetails.division;
        document.getElementById('sportFmt').textContent = data.sportDetails.format;
      }
    }
  </script>
</body>
</html>
